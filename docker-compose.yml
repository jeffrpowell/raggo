version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  tika:
    image: apache/tika:latest-full
    ports:
      - "9998:9998"  # Tika HTTP API
    restart: unless-stopped

volumes:
  qdrant_storage:
