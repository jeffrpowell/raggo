services:
  raggo:
    image: ghcr.io/jeffrpowell/raggo:v1.2.0
    restart: unless-stopped
    depends_on:
      - qdrant
      - tika
    # API keys for the service endpoints (RAGGO_*_API_KEY). Copy .env.example
    # to .env and fill in only the services that need auth.
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=UTC
    volumes:
      - ./config/raggo.yml:/etc/raggo/raggo.yml:ro
      - ./data:/var/lib/raggo
      - ./documents:/mnt/documents:ro

  # Text extraction for PDF and Office files. raggo.yml points at it with
  # services.tika_endpoint: http://tika:9998.
  tika:
    image: apache/tika:latest-full
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    # Loopback only; raggo reaches Qdrant at qdrant:6334 on the compose network.
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    # To require an API key on Qdrant itself, uncomment this and set
    # RAGGO_QDRANT_API_KEY in .env so raggo sends the same key.
    # environment:
    #   - QDRANT__SERVICE__API_KEY=${RAGGO_QDRANT_API_KEY}

volumes:
  qdrant-storage:
